
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteFlow 2.2 — Your Space</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080f20;
 color:#eaf0ff;
 display:flex;
 min-height:100vh
}
.sidebar{
 width:240px;
 background:#0d1830;
 padding:25px 18px;
 border-right:1px solid #243453;
 flex-shrink:0
}
.logo{font-size:25px;font-weight:bold;color:#8db5ff;margin-bottom:35px}
.nav{
 padding:13px;
 margin:7px 0;
 border-radius:10px;
 cursor:pointer;
 color:#b9c8e8
}
.nav:hover,.nav.active{background:#20375f;color:white}
main{flex:1;padding:30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0 0 8px}
.subtitle{color:#94a7ca}
button{
 border:0;
 padding:11px 16px;
 border-radius:9px;
 background:#477eea;
 color:white;
 cursor:pointer;
 font-weight:bold
}
button:hover{filter:brightness(1.12)}
button.secondary{background:#263957}
button.danger{background:#a63d50}
input,textarea{
 width:100%;
 background:#111f39;
 color:white;
 border:1px solid #344969;
 padding:13px;
 border-radius:9px;
 outline:none;
 font:inherit
}
input:focus,textarea:focus{border-color:#76a5ff}
.search{margin:25px 0 18px;max-width:500px}
.notes{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
 gap:16px;
 margin-top:20px
}
.note{
 background:#111f39;
 border:1px solid #263b5d;
 padding:18px;
 border-radius:13px;
 min-height:170px;
 display:flex;
 flex-direction:column;
 gap:12px
}
.note h3{margin:0;overflow-wrap:anywhere}
.note p{
 color:#aebedb;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 flex:1;
 margin:0
}
.note-actions{display:flex;gap:7px;flex-wrap:wrap}
.note-actions button{padding:8px 10px;font-size:12px}
.note small{color:#8095ba}
.empty{color:#91a5c8;margin-top:40px}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#000b;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:10
}
.modal-box{
 background:#101e38;
 border:1px solid #344969;
 padding:24px;
 border-radius:15px;
 width:min(500px,100%)
}
.modal-box h2{margin-top:0}
.modal-box textarea{height:180px;resize:vertical;margin:12px 0}
.modal-box input{margin:8px 0}
.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
@media(max-width:650px){
 body{display:block}
 .sidebar{width:100%;padding:15px}
 .logo{margin-bottom:12px}
 .sidebar nav{display:flex;flex-wrap:wrap}
 main{padding:20px}
}
</style>
</head>

<body>

<aside class="sidebar">
 <div class="logo">▤ NoteFlow</div>
 <div class="nav active" data-view="all" onclick="changeView('all')">▤ All Notes <span id="allCount"></span></div>
 <div class="nav" data-view="favorites" onclick="changeView('favorites')">☆ Favorites</div>
 <div class="nav" data-view="trash" onclick="changeView('trash')">▱ Trash</div>
 <p style="color:#7187ad;font-size:12px;margin-top:35px">YOUR PERSONAL WORKSPACE</p>
 <small style="color:#7187ad">NoteFlow 2.2</small>
</aside>

<main>
 <div class="top">
  <div>
   <h1 id="heading">Your Notes ✨</h1>
   <div class="subtitle">Capture your thoughts. Keep your ideas.</div>
  </div>
  <button id="newButton" onclick="openEditor()">+ New Note</button>
 </div>

 <input class="search" id="search" placeholder="Search your notes..." oninput="renderNotes()">
 <div id="notes" class="notes"></div>
</main>

<div class="modal" id="editor">
 <div class="modal-box">
  <h2 id="editorHeading">Create Note</h2>
  <input id="noteTitle" placeholder="Note title">
  <textarea id="noteContent" placeholder="Write something..."></textarea>
  <div id="lockOptions">
   <label><input type="checkbox" id="makeLocked" style="width:auto"> Password protect this note</label>
   <input id="newPassword" type="password" placeholder="Create a password (for new locked notes)">
  </div>
  <div class="modal-actions">
   <button onclick="saveNote()">Save Note</button>
   <button class="secondary" onclick="closeEditor()">Cancel</button>
  </div>
 </div>
</div>

<script>
const STORAGE_KEY='noteflow_notes';

let notes=[];
let view='all';
let editingId=null;
let unlockedNotes=new Set();

function loadNotes(){
 try{
  const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  notes=Array.isArray(stored)?stored:[];
 }catch{
  notes=[];
 }
}

function persist(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));
  return true;
 }catch(error){
  alert('Could not save your notes. Your browser storage may be full.');
  return false;
 }
}

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function changeView(next){
 view=next;
 document.querySelectorAll('.nav').forEach(el=>{
  el.classList.toggle('active',el.dataset.view===next);
 });
 document.getElementById('heading').textContent=
  next==='all'?'Your Notes ✨':
  next==='favorites'?'Your Favorites ☆':'Trash ▱';
 document.getElementById('newButton').style.display=next==='trash'?'none':'block';
 renderNotes();
}

async function hashPassword(password,salt){
 const encoder=new TextEncoder();
 const keyMaterial=await crypto.subtle.importKey(
  'raw',encoder.encode(password),'PBKDF2',false,['deriveKey']
 );
 return crypto.subtle.deriveKey(
  {name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},
  keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt']
 );
}

function toBase64(bytes){
 return btoa(String.fromCharCode(...new Uint8Array(bytes)));
}

function fromBase64(value){
 return Uint8Array.from(atob(value),c=>c.charCodeAt(0));
}

async function encryptData(text,password){
 const salt=crypto.getRandomValues(new Uint8Array(16));
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await hashPassword(password,salt);
 const encrypted=await crypto.subtle.encrypt(
  {name:'AES-GCM',iv},key,new TextEncoder().encode(text)
 );
 return {
  salt:toBase64(salt),
  iv:toBase64(iv),
  data:toBase64(encrypted)
 };
}

async function decryptData(note,password){
 const key=await hashPassword(password,fromBase64(note.salt));
 const decrypted=await crypto.subtle.decrypt(
  {name:'AES-GCM',iv:fromBase64(note.iv)},
  key,fromBase64(note.data)
 );
 return JSON.parse(new TextDecoder().decode(decrypted));
}

function openEditor(id=null){
 editingId=id;
 const note=id?notes.find(n=>n.id===id):null;
 if(note&&note.locked){
  alert('Locked notes must be unlocked before editing.');
  return;
 }
 document.getElementById('editorHeading').textContent=note?'Edit Note':'Create Note';
 document.getElementById('noteTitle').value=note?.title||'';
 document.getElementById('noteContent').value=note?.content||'';
 document.getElementById('makeLocked').checked=false;
 document.getElementById('newPassword').value='';
 document.getElementById('lockOptions').style.display=note?'none':'block';
 document.getElementById('editor').style.display='flex';
}

function closeEditor(){
 document.getElementById('editor').style.display='none';
}

async function saveNote(){
 const title=document.getElementById('noteTitle').value.trim();
 const content=document.getElementById('noteContent').value.trim();
 if(!title&&!content){
  alert('Please write a title or some content.');
  return;
 }

 if(editingId){
  const note=notes.find(n=>n.id===editingId);
  if(!note)return;
  note.title=title||'Untitled';
  note.content=content;
  note.updated=Date.now();
 }else{
  const locked=document.getElementById('makeLocked').checked;
  let note={
   id:uid(),
   title:title||'Untitled',
   content,
   favorite:false,
   pinned:false,
   trash:false,
   locked:false,
   created:Date.now(),
   updated:Date.now()
  };

  if(locked){
   if(!crypto.subtle){
    alert('Secure encryption is unavailable in this browser. Open the HTTPS website.');
    return;
   }
   const password=document.getElementById('newPassword').value;
   if(!password){
    alert('Please create a password.');
    return;
   }
   try{
    const encrypted=await encryptData(
     JSON.stringify({title:note.title,content:note.content}),password
    );
    note={...note,...encrypted,locked:true};
    delete note.title;
    delete note.content;
   }catch(error){
    alert('Could not protect this note.');
    return;
   }
  }
  notes.unshift(note);
 }

 if(!persist())return;
 closeEditor();
 renderNotes();
}

async function unlockNote(note){
 const password=prompt('Enter the password for this note:');
 if(password===null)return null;
 try{
  const data=await decryptData(note,password);
  unlockedNotes.add(note.id);
  return data;
 }catch{
  alert('Incorrect password.');
  return null;
 }
}

async function verifyNotePassword(note){
 const password=prompt('🔐 Enter this note’s password to confirm deletion:');
 if(password===null)return false;
 if(!password){
  alert('A password is required.');
  return false;
 }
 try{
  await decryptData(note,password);
  return true;
 }catch{
  alert('Incorrect password. The note was NOT deleted.');
  return false;
 }
}

async function openNote(id){
 const note=notes.find(n=>n.id===id);
 if(!note)return;
 if(note.locked){
  const data=await unlockNote(note);
  if(!data)return;
  document.getElementById('editor').style.display='flex';
  document.getElementById('editorHeading').textContent='Locked Note — View Only';
  document.getElementById('noteTitle').value=data.title;
  document.getElementById('noteContent').value=data.content;
  document.getElementById('noteTitle').readOnly=true;
  document.getElementById('noteContent').readOnly=true;
  document.getElementById('lockOptions').style.display='none';
  document.querySelector('#editor .modal-actions').innerHTML=
   '<button class="secondary" onclick="closeLockedViewer()">Close</button>';
 }else{
  openEditor(id);
 }
}

function closeLockedViewer(){
 document.getElementById('noteTitle').readOnly=false;
 document.getElementById('noteContent').readOnly=false;
 document.querySelector('#editor .modal-actions').innerHTML=
  '<button onclick="saveNote()">Save Note</button><button class="secondary" onclick="closeEditor()">Cancel</button>';
 closeEditor();
}

async function deleteNote(id){
 const note=notes.find(n=>n.id===id);
 if(!note)return;

 // Password verification happens before either deletion action.
 if(note.locked){
  const correct=await verifyNotePassword(note);
  if(!correct)return;
 }

 if(note.trash){
  if(!confirm('Permanently delete this note? This cannot be undone.'))return;
  notes=notes.filter(n=>n.id!==id);
  unlockedNotes.delete(id);
 }else{
  note.trash=true;
  unlockedNotes.delete(id);
 }

 if(!persist()){
  loadNotes();
  renderNotes();
  return;
 }
 renderNotes();
}

function restoreNote(id){
 const note=notes.find(n=>n.id===id);
 if(!note)return;
 note.trash=false;
 persist();
 renderNotes();
}

function toggleFavorite(id){
 const note=notes.find(n=>n.id===id);
 if(!note)return;
 note.favorite=!note.favorite;
 persist();
 renderNotes();
}

function togglePin(id){
 const note=notes.find(n=>n.id===id);
 if(!note)return;
 note.pinned=!note.pinned;
 persist();
 renderNotes();
}

function renderNotes(){
 const container=document.getElementById('notes');
 const query=document.getElementById('search').value.toLowerCase();
 document.getElementById('allCount').textContent=
  '('+notes.filter(n=>!n.trash).length+')';

 let visible=notes.filter(note=>{
  if(view==='trash'?!note.trash:note.trash)return false;
  if(view==='favorites'&&!note.favorite)return false;
  if(note.locked){
   return query===''&&true;
  }
  return (note.title+' '+note.content).toLowerCase().includes(query);
 });

 visible.sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||((b.updated||0)-(a.updated||0)));

 if(!visible.length){
  container.innerHTML='<div class="empty">No notes here yet. Create a note to get started!</div>';
  return;
 }

 container.innerHTML='';
 visible.forEach(note=>{
  const card=document.createElement('article');
  card.className='note';

  const title=document.createElement('h3');
  title.textContent=note.locked?'🔒 Locked Note':note.title;

  const content=document.createElement('p');
  content.textContent=note.locked?'Your private note is protected.':note.content;

  const date=document.createElement('small');
  date.textContent=note.pinned?'📌 Pinned · '+new Date(note.updated||note.created).toLocaleDateString():
   new Date(note.updated||note.created).toLocaleDateString();

  const actions=document.createElement('div');
  actions.className='note-actions';

  function addButton(label,handler,cls='secondary'){
   const btn=document.createElement('button');
   btn.textContent=label;
   btn.className=cls;
   btn.onclick=handler;
   actions.appendChild(btn);
  }

  if(note.trash){
   addButton('Restore',()=>restoreNote(note.id));
   addButton('Delete permanently',()=>deleteNote(note.id),'danger');
  }else{
   addButton('Open',()=>openNote(note.id));
   addButton(note.favorite?'★':'☆',()=>toggleFavorite(note.id));
   addButton(note.pinned?'Unpin':'📌 Pin',()=>togglePin(note.id));
   addButton('Delete',()=>deleteNote(note.id),'danger');
  }

  card.append(title,content,date,actions);
  container.appendChild(card);
 });
}

loadNotes();
renderNotes();
</script>
</body>
</html>
